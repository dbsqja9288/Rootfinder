name: 소셜 자동 게시 (스레드 + X)

# 하루 6회. cron은 UTC 기준이라 한국시간 -9시간으로 적는다.
#  23:00 UTC = 08:00 KST  출근길
#  01:30 UTC = 10:30 KST  오전
#  03:30 UTC = 12:30 KST  점심
#  06:00 UTC = 15:00 KST  오후
#  10:00 UTC = 19:00 KST  퇴근 후
#  13:00 UTC = 22:00 KST  잠들기 전
#
# 이 시각 순서는 scripts/variants.mjs의 SLOTS와 같아야 A/B 교대가 정확히 맞는다.
on:
  schedule:
    - cron: "0 23 * * *"
    - cron: "30 1 * * *"
    - cron: "30 3 * * *"
    - cron: "0 6 * * *"
    - cron: "0 10 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch: # 수동 실행 버튼
    inputs:
      variant:
        description: "올릴 소재 (비워두면 시간대에 따라 자동 교대)"
        required: false
        type: choice
        options: ["", "A", "B"]
        default: ""

jobs:
  threads:
    name: 스레드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 스레드 게시
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL || 'https://rootfinder-pi.vercel.app' }}
          VARIANT: ${{ inputs.variant }}
        shell: bash
        run: |
          # pipefail이 없으면 node가 죽어도 tee의 성공 코드로 덮여 실패가 감춰진다
          set -o pipefail
          node scripts/social-post.mjs | tee -a "$GITHUB_STEP_SUMMARY"

  x:
    name: X
    runs-on: ubuntu-latest
    # 기본은 꺼져 있다.
    #
    # X는 2026년 2월부터 무료 등급이 없어지고 선불 크레딧 종량제로 바뀌었다.
    # 링크가 들어간 글은 건당 단가가 크게 붙어서, 하루 6회를 돌리면 매달 실비가 나간다.
    # 그래서 돈을 쓰기로 결정하기 전까지는 이 작업을 건너뛴다.
    #
    # 켜려면: 저장소 Settings → Secrets and variables → Actions → Variables 탭에서
    #         X_ENABLED = true 를 만들면 된다. (지우면 다시 꺼진다)
    # 코드는 그대로 살아 있으므로 열쇠 4개와 이 변수만 있으면 바로 돈다.
    if: vars.X_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: X 게시
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://rootfinder-pi.vercel.app' }}
          VARIANT: ${{ inputs.variant }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/x-post.mjs | tee -a "$GITHUB_STEP_SUMMARY"
