name: 스레드 자동 게시

on:
  schedule:
    - cron: "0 23 * * *"
    - cron: "30 1 * * *"
    - cron: "30 3 * * *"
    - cron: "0 6 * * *"
    - cron: "0 10 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch: # 수동 실행 버튼

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 문안 생성 및 게시
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL || 'https://rootfinder-pi.vercel.app' }}
        run: node scripts/social-post.mjs | tee $GITHUB_STEP_SUMMARY
