name: 소셜 자동 게시 (스레드 + X)

# 하루 96회 — 15분마다.
#
# 서비스 네 개(조선시대 / 몇 촌일까 / 가문 운세 / 성씨 찾기)가 순서대로 돌아가서
# 각각 하루 24회씩 균등하게 나간다. 문구는 서비스마다 12개라 같은 글이 하루 두 번만 나간다.
#
# 스레드 API 한도는 24시간당 게시물 250개다. 96회는 그 38% 수준이라 정책상 여유가 있다.
# 다만 깃허브의 예약 실행은 정시를 몇 분 밀거나 건너뛰는 일이 잦아서 실제로는 80~95회쯤 된다.
#
# 되돌리려면 이 cron과 scripts/variants.mjs의 SLOT_COUNT를 같이 낮춘다.
#   매시 정각(24회) = "0 * * * *"  + SLOT_COUNT 24
#   30분마다(48회)  = "*/30 * * * *" + SLOT_COUNT 48
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: # 수동 실행 버튼
    inputs:
      service:
        description: "올릴 서비스 (비워두면 시간대에 따라 자동 교대)"
        required: false
        type: choice
        options: ["", "조선", "촌수", "운세", "성씨"]
        default: ""
      post_id:
        description: "문구 id (비워두면 날짜에 따라 자동 교대)"
        required: false
        type: string
        default: ""

jobs:
  threads:
    name: 스레드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 스레드 게시
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          # 예전에 저장소 변수(vars.SITE_URL)에 넣어둔 vercel.app 주소가 계속 우선해서
          # 스레드에 옛 주소가 나갔다. 도메인이 확정됐으니 코드에 고정한다.
          # 변수는 지우지 않아도 되고, 지워도 아무 영향이 없다.
          SITE_URL: "https://rootfinder.kr"
          SERVICE: ${{ inputs.service }}
          POST_ID: ${{ inputs.post_id }}
        shell: bash
        run: |
          # pipefail이 없으면 node가 죽어도 tee의 성공 코드로 덮여 실패가 감춰진다
          set -o pipefail
          node scripts/social-post.mjs | tee -a "$GITHUB_STEP_SUMMARY"

  x:
    name: X
    runs-on: ubuntu-latest
    # 기본은 꺼져 있다.
    #
    # X는 2026년 2월부터 무료 등급이 없어지고 선불 크레딧 종량제로 바뀌었다.
    # 링크가 들어간 글은 건당 단가가 크게 붙어서, 하루 6회를 돌리면 매달 실비가 나간다.
    # 그래서 돈을 쓰기로 결정하기 전까지는 이 작업을 건너뛴다.
    #
    # 켜려면: 저장소 Settings → Secrets and variables → Actions → Variables 탭에서
    #         X_ENABLED = true 를 만들면 된다. (지우면 다시 꺼진다)
    # 코드는 그대로 살아 있으므로 열쇠 4개와 이 변수만 있으면 바로 돈다.
    if: vars.X_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: X 게시
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          # 예전에 저장소 변수(vars.SITE_URL)에 넣어둔 vercel.app 주소가 계속 우선해서
          # 스레드에 옛 주소가 나갔다. 도메인이 확정됐으니 코드에 고정한다.
          # 변수는 지우지 않아도 되고, 지워도 아무 영향이 없다.
          SITE_URL: "https://rootfinder.kr"
          SERVICE: ${{ inputs.service }}
          POST_ID: ${{ inputs.post_id }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/x-post.mjs | tee -a "$GITHUB_STEP_SUMMARY"
