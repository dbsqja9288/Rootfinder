name: 소셜 자동 게시 (스레드 + X)

# 하루 18회. cron은 UTC 기준이라 한국시간 -9시간으로 적는다.
#
#  KST 00 01 02 03  05  07  09 10 11 12 13  15  17  19 20 21 22 23
#  UTC 15 16 17 18  20  22  00 01 02 03 04  06  08  10 11 12 13 14
#
# ★ 분(minute)을 일부러 제각각으로 흩어 놓았다. 정각이 아니다.
#
#   2026-08-27, 예약 실행이 **12시간 넘게 한 번도 안 걸렸다**(01:55 KST 이후 침묵).
#   깃허브 문서가 밝히는 대로 schedule은 최선노력(best-effort)이라
#   "서버 부하가 높은 시간대에는 지연되고, 아예 건너뛰기도" 한다.
#   그리고 가장 붐비는 순간이 **매시 정각** — 전 세계가 거기에 몰아놨기 때문이다.
#   18개를 전부 0분에 두고 있었으니 매번 그 정체에 끼어든 셈이다.
#
#   그래서 7분, 23분, 41분… 처럼 흩었다. 15·30·45분도 흔해서 피했다.
#
#   ※ 시각이 밀려도 A/B 교대와 문구 선택은 이제 흔들리지 않는다.
#     그건 실행 번호(GITHUB_RUN_NUMBER)로 정하기 때문이다.
#     예전처럼 시각으로 정했다면 이 변경이 배분을 통째로 망가뜨렸을 것이다.
#
# 새벽(KST 00~03)도 넣었다. 스레드는 밤에 사람이 남아 있는 편이라 그 시간대도 노출이 나온다.
# KST 04·06·08·14·16·18시는 뺐다 — 18회를 고르게 퍼뜨리면서 황금시간(21~23)은 촘촘히 두기 위해서다.
#
# 이 목록은 scripts/variants.mjs의 SLOTS와 맞춰 두면 "언제 올라가는지"를 코드에서도 읽을 수 있다.
#
# ※ A/B 교대는 더 이상 이 시각표로 정하지 않는다.
#   깃허브 액션의 예약 실행은 자주 늦어서, 늦어진 시각이 표에 없으면 A/B가 엉켰다.
#   (하루치가 전부 같은 소재로 쏠리고, 똑같은 글이 연달아 올라갔다.)
#   지금은 실행마다 1씩 늘어나는 GITHUB_RUN_NUMBER로 정한다 — 늦어도 겹치지 않는다.
#   자세한 건 scripts/variants.mjs의 seq() 주석 참고.
on:
  schedule:
    - cron: "38 15 * * *"   # KST 00:38
    - cron: "11 16 * * *"   # KST 01:11
    - cron: "56 17 * * *"   # KST 02:56
    - cron: "29 18 * * *"   # KST 03:29
    - cron: "44 20 * * *"   # KST 05:44
    - cron: "17 22 * * *"   # KST 07:17
    - cron: "7 0 * * *"   # KST 09:07
    - cron: "23 1 * * *"   # KST 10:23
    - cron: "41 2 * * *"   # KST 11:41
    - cron: "13 3 * * *"   # KST 12:13
    - cron: "52 4 * * *"   # KST 13:52
    - cron: "18 6 * * *"   # KST 15:18
    - cron: "34 8 * * *"   # KST 17:34
    - cron: "9 10 * * *"   # KST 19:09
    - cron: "27 11 * * *"   # KST 20:27
    - cron: "48 12 * * *"   # KST 21:48
    - cron: "6 13 * * *"   # KST 22:06
    - cron: "21 14 * * *"   # KST 23:21
  workflow_dispatch: # 수동 실행 버튼
    inputs:
      variant:
        description: "올릴 소재 (비워두면 시간대에 따라 자동 교대)"
        required: false
        type: choice
        options: ["", "A", "B"]
        default: ""

# 이 워크플로는 저장소에 아무것도 쓰지 않는다. 읽기만 준다.
#
# 저장소 기본값을 "Read and write"로 열어 두더라도(성적 수집 워크플로가 커밋을
# 해야 해서 필요하다), 여기까지 덩달아 쓰기 권한을 갖게 둘 이유는 없다.
permissions:
  contents: read

jobs:
  threads:
    name: 스레드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 스레드 게시
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          # 예전에 저장소 변수(vars.SITE_URL)에 넣어둔 vercel.app 주소가 계속 우선해서
          # 스레드에 옛 주소가 나갔다. 도메인이 확정됐으니 코드에 고정한다.
          # 변수는 지우지 않아도 되고, 지워도 아무 영향이 없다.
          SITE_URL: "https://rootfinder.kr"
          VARIANT: ${{ inputs.variant }}
        shell: bash
        run: |
          # pipefail이 없으면 node가 죽어도 tee의 성공 코드로 덮여 실패가 감춰진다
          set -o pipefail
          node scripts/social-post.mjs | tee -a "$GITHUB_STEP_SUMMARY"

  x:
    name: X
    runs-on: ubuntu-latest
    # 기본은 꺼져 있다.
    #
    # X는 2026년 2월부터 무료 등급이 없어지고 선불 크레딧 종량제로 바뀌었다.
    # 링크가 들어간 글은 건당 단가가 크게 붙어서, 하루 6회를 돌리면 매달 실비가 나간다.
    # 그래서 돈을 쓰기로 결정하기 전까지는 이 작업을 건너뛴다.
    #
    # 켜려면: 저장소 Settings → Secrets and variables → Actions → Variables 탭에서
    #         X_ENABLED = true 를 만들면 된다. (지우면 다시 꺼진다)
    # 코드는 그대로 살아 있으므로 열쇠 4개와 이 변수만 있으면 바로 돈다.
    if: vars.X_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: X 게시
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          # 예전에 저장소 변수(vars.SITE_URL)에 넣어둔 vercel.app 주소가 계속 우선해서
          # 스레드에 옛 주소가 나갔다. 도메인이 확정됐으니 코드에 고정한다.
          # 변수는 지우지 않아도 되고, 지워도 아무 영향이 없다.
          SITE_URL: "https://rootfinder.kr"
          VARIANT: ${{ inputs.variant }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/x-post.mjs | tee -a "$GITHUB_STEP_SUMMARY"
