name: 소셜 자동 게시 (스레드 + X)

# 하루 18회. cron은 UTC 기준이라 한국시간 -9시간으로 적는다.
#
#  KST 00 01 02 03  05  07  09 10 11 12 13  15  17  19 20 21 22 23
#  UTC 15 16 17 18  20  22  00 01 02 03 04  06  08  10 11 12 13 14
#
# 새벽(KST 00~03)도 넣었다. 스레드는 밤에 사람이 남아 있는 편이라 그 시간대도 노출이 나온다.
# KST 04·06·08·14·16·18시는 뺐다 — 18회를 고르게 퍼뜨리면서 황금시간(21~23)은 촘촘히 두기 위해서다.
#
# 이 목록은 scripts/variants.mjs의 SLOTS와 맞춰 두면 "언제 올라가는지"를 코드에서도 읽을 수 있다.
#
# ※ A/B 교대는 더 이상 이 시각표로 정하지 않는다.
#   깃허브 액션의 예약 실행은 자주 늦어서, 늦어진 시각이 표에 없으면 A/B가 엉켰다.
#   (하루치가 전부 같은 소재로 쏠리고, 똑같은 글이 연달아 올라갔다.)
#   지금은 실행마다 1씩 늘어나는 GITHUB_RUN_NUMBER로 정한다 — 늦어도 겹치지 않는다.
#   자세한 건 scripts/variants.mjs의 seq() 주석 참고.
on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 1 * * *"
    - cron: "0 2 * * *"
    - cron: "0 3 * * *"
    - cron: "0 4 * * *"
    - cron: "0 6 * * *"
    - cron: "0 8 * * *"
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
    - cron: "0 15 * * *"
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
    - cron: "0 18 * * *"
    - cron: "0 20 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch: # 수동 실행 버튼
    inputs:
      variant:
        description: "올릴 소재 (비워두면 시간대에 따라 자동 교대)"
        required: false
        type: choice
        options: ["", "A", "B"]
        default: ""

jobs:
  threads:
    name: 스레드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 스레드 게시
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          # 예전에 저장소 변수(vars.SITE_URL)에 넣어둔 vercel.app 주소가 계속 우선해서
          # 스레드에 옛 주소가 나갔다. 도메인이 확정됐으니 코드에 고정한다.
          # 변수는 지우지 않아도 되고, 지워도 아무 영향이 없다.
          SITE_URL: "https://rootfinder.kr"
          VARIANT: ${{ inputs.variant }}
        shell: bash
        run: |
          # pipefail이 없으면 node가 죽어도 tee의 성공 코드로 덮여 실패가 감춰진다
          set -o pipefail
          node scripts/social-post.mjs | tee -a "$GITHUB_STEP_SUMMARY"

  x:
    name: X
    runs-on: ubuntu-latest
    # 기본은 꺼져 있다.
    #
    # X는 2026년 2월부터 무료 등급이 없어지고 선불 크레딧 종량제로 바뀌었다.
    # 링크가 들어간 글은 건당 단가가 크게 붙어서, 하루 6회를 돌리면 매달 실비가 나간다.
    # 그래서 돈을 쓰기로 결정하기 전까지는 이 작업을 건너뛴다.
    #
    # 켜려면: 저장소 Settings → Secrets and variables → Actions → Variables 탭에서
    #         X_ENABLED = true 를 만들면 된다. (지우면 다시 꺼진다)
    # 코드는 그대로 살아 있으므로 열쇠 4개와 이 변수만 있으면 바로 돈다.
    if: vars.X_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: X 게시
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          # 예전에 저장소 변수(vars.SITE_URL)에 넣어둔 vercel.app 주소가 계속 우선해서
          # 스레드에 옛 주소가 나갔다. 도메인이 확정됐으니 코드에 고정한다.
          # 변수는 지우지 않아도 되고, 지워도 아무 영향이 없다.
          SITE_URL: "https://rootfinder.kr"
          VARIANT: ${{ inputs.variant }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/x-post.mjs | tee -a "$GITHUB_STEP_SUMMARY"
